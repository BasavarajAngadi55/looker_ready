name: LookML CI/CD Pipeline

on:
  # 1. Automatic CI trigger when a Pull Request is opened/updated targeting main or master
  pull_request:
    branches:
      - main
      - master

  # 2. Manual trigger button in GitHub Actions UI
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1: Continuous Integration (CI)
  # Runs on project_b on Pull Requests OR when manually triggered
  # =========================================================
  ci-validate:
    name: Validate LookML & Run Tests
    # UPDATED: Runs on PRs AND on manual workflow_dispatch triggers
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Spectacles
        run: |
          python -m pip install --upgrade pip
          pip install spectacles

      # Step A: Run LookML Compiler Check on project_b via Looker REST API
      - name: Run LookML Compiler Check on project_b
        env:
          LOOKER_BASE_URL: "https://panderasystems.looker.com"
          LOOKER_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKER_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
        run: |
          spectacles lookml \
            --project project_b \
            --branch ${{ github.head_ref || github.ref_name }} \
            --remote-reset

      # Step B: Execute Data Assertions on project_b via Looker REST API
      - name: Execute LookML Data Assertions on project_b
        env:
          LOOKER_BASE_URL: "https://panderasystems.looker.com"
          LOOKER_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKER_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
        run: |
          spectacles assert \
            --project project_b \
            --branch ${{ github.head_ref || github.ref_name }}

  # =========================================================
  # JOB 2: Continuous Deployment (CD)
  # Deploys code to project_c via Webhook when manually triggered
  # =========================================================
  cd-deploy:
    name: Deploy to Production (project_c)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Production Looker Deployment Webhook
        run: |
          curl -X POST "https://panderasystems.looker.com/webhooks/projects/project_c/deploy" \
            -H "X-Looker-Deploy-Secret: ${{ secrets.Test }}"
